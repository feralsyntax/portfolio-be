<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Portfolio - New Message</title>
  </head>
  <body
    style="
      font-family: sans-serif;
      background-color: #fbfbfb;
      margin: 0;
      padding: 0;
    "
  >
    <table
      width="600"
      cellpadding="0"
      cellspacing="0"
      style="background-color: #fbfbfb; margin: 0 auto"
    >
      <tr>
        <td
          style="
            padding: 20px;
            text-align: center;
            font-size: 18px;
            color: #313131;
          "
        >
          <h1>Hello, Benie!</h1>
        </td>
      </tr>
      <tr>
        <td
          style="
            padding: 20px;
            text-align: left;
            line-height: 1.5;
            color: #3f3f3f;
          "
        >
          <p>
            Someone just sent you a message from your portfolio website
            {{website_url}}. For your records, here are the details they
            submitted:
          </p>
          <p>Name: {{name}}</p>
          <p>Email: {{email}}</p>
          <div>
            <p>Message:</p>
            <blockquote>{{message}}</blockquote>
          </div>
        </td>
      </tr>

      <tr>
        <td style="padding: 20px; text-align: center">
          <a
            href="{{website_url}}"
            style="
              background-color: #2c9732;
              color: #fff;
              padding: 10px 20px;
              border: none;
              border-radius: 5px;
              text-decoration: none;
            "
            >Visit the Site</a
          >
        </td>
      </tr>
      <tr>
        <td
          style="
            padding: 10px;
            text-align: center;
            font-size: 12px;
            color: #3f3f3f;
          "
        >
          <p>&copy; {{current_year}} Benson Lang'at - All rights reserved.</p>
        </td>
      </tr>
    </table>
  </body>
</html>
